name: Issue Commenter

on:
  issues:
    types: [opened]

jobs:
  comment-job:
    runs-on: ubuntu-latest

    steps:
    - name: Comment on Issue
      uses: actions/github-script@v6
      with:
        script: |
          const labels = issue.labels.map(label => label.name);
          const userName = 'msnkb';
          let comment = '';
          if (labels.includes('bug')) {
            comment = `Thank you. We will fix it. Best regards, ${userName}.`;
          } else if (labels.includes('feature')) {
            comment = `Thank you, we will consider to include this feature. Best regards, ${userName}.`;
          } else if (labels.includes('discussion')) {
            comment = `Happy to discuss this topic with you. Best regards, ${userName}.`;
          } else {
            comment = 'Hello, world!';
          }
          github.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });